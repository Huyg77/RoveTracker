<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201b1a">
  <title>Rove — Hitpoint Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="app-title">
        <span>ROVE</span>
        <span>DAMAGE TRACKER</span>
      </div>

      <div class="topbar-actions">
        <div class="history-actions" aria-label="Changes">
          <button id="undoButton" class="secondary-button" type="button"
            aria-label="Undo" title="Undo" disabled>↶</button>
          <button id="redoButton" class="secondary-button" type="button"
            aria-label="Redo" title="Redo" disabled>↷</button>
        </div>

        <button id="wakeLockButton" class="secondary-button" type="button"
          aria-pressed="false" title="Keep screen awake">WakeLock</button>

        <button id="roundTrackerButton" class="round-tracker" type="button"
          aria-label="Change current round" aria-expanded="false"
          title="Change current round">R<span id="currentRound">1</span></button>

        <button id="configButton" class="add-button" type="button"
          aria-label="Configure heroes and monsters" title="Configure heroes and monsters">M</button>

        <button id="resetButton" class="secondary-button" type="button">Reset</button>
      </div>
    </header>

    <section class="heroes" id="heroes" aria-label="Heroes"></section>

    <section class="board" aria-label="Monster hitpoints">
      <div id="monsterGroups"></div>
    </section>

    <p class="hint">Click a field to adjust hitpoints. Click a round ability to change it from 1–4.</p>
  </main>

  <!-- HP editor: used for both monsters and heroes -->
  <dialog id="hpDialog">
    <div class="modal" id="hpForm">
      <button class="close-button" type="button" id="closeButton" aria-label="Close">×</button>

      <p class="eyebrow" id="dialogMonster">MONSTER A</p>
      <h2 id="dialogTitle">Field 1</h2>

      <div class="hp-value-control">
        <button class="hp-step-button" type="button" data-step="-1" aria-label="Decrease by 1">−</button>
        <span class="hp-value-display" id="hpValueDisplay">—</span>
        <button class="hp-step-button" type="button" data-step="1" aria-label="Increase by 1">+</button>
      </div>

      <div class="hp-adjustments" aria-label="Adjust hitpoints">
        <button type="button" class="hp-adjust-button damage" data-hp-change="-5">−5</button>
        <button type="button" class="hp-adjust-button damage" data-hp-change="-3">−3</button>
        <button type="button" class="hp-adjust-button damage" data-hp-change="-2">−2</button>
        <button type="button" class="hp-adjust-button heal" data-hp-change="2">+2</button>
        <button type="button" class="hp-adjust-button heal" data-hp-change="3">+3</button>
        <button type="button" class="hp-adjust-button heal" data-hp-change="5">+5</button>
      </div>

      <section class="hp-history" aria-labelledby="hpHistoryTitle">
        <div class="hp-history-header">
          <span class="eyebrow" id="hpHistoryTitle">Previous hitpoints</span>
        </div>
        <div id="hpHistory" class="hp-history-list">
          <span class="hp-history-empty">No changes yet</span>
        </div>
      </section>

      <div class="modal-actions">
        <button class="secondary-button" type="button" id="clearButton">Clear</button>
        <button class="primary-button" type="button" id="saveButton">Save</button>
      </div>
    </div>
  </dialog>

  <!-- Heroes / monster configuration -->
  <dialog id="configDialog">
    <div class="modal config-modal">
      <button class="close-button" type="button" id="configCloseButton" aria-label="Close">×</button>
      <p class="eyebrow">SETTINGS</p>
      <h2>Heroes &amp; monsters</h2>

      <div class="config-section">
        <label for="heroCountSelect">Number of heroes</label>
        <select id="heroCountSelect">
          <option value="2">2 heroes</option>
          <option value="3" selected>3 heroes</option>
          <option value="4">4 heroes</option>
        </select>
      </div>

      <div class="config-section">
        <label for="monsterCountSelect">Number of monster rows</label>
        <select id="monsterCountSelect">
          <option value="3" selected>3 monsters (A–C)</option>
          <option value="4">4 monsters (A–D)</option>
          <option value="5">5 monsters (A–E)</option>
          <option value="6">6 monsters (A–F)</option>
        </select>
      </div>

      <p class="config-note">Existing HP, turn statuses, and round abilities will be preserved when you change the counts.</p>

      <div class="modal-actions">
        <button class="secondary-button" type="button" id="configCancelButton">Cancel</button>
        <button class="primary-button" type="button" id="configSaveButton">Save</button>
      </div>
    </div>
  </dialog>

  <dialog id="roundDialog">
    <div class="round-modal">
      <button class="close-button" type="button" id="roundCloseButton" aria-label="Close">×</button>
      <p class="eyebrow">ROUND</p>
      <div class="round-controls">
        <button class="round-adjust-button" type="button" id="roundMinusButton" aria-label="Decrease round">−</button>
        <span id="roundDialogValue">1</span>
        <button class="round-adjust-button" type="button" id="roundPlusButton" aria-label="Increase round">+</button>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
