<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#201b1a">
  <title>Rove — Hitpoint Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">ROVE</p>
        <h5>Hitpoint Tracker</h5>
      </div>
      <div class="topbar-actions">
          <button
    id="wakeLockButton"
    class="secondary-button"
    type="button"
    aria-pressed="false"
    title="Scherm wakker houden"
  >
    Scherm wakker
  </button>
        <button
  id="roundTrackerButton"
  class="round-tracker"
  type="button"
  aria-label="Huidige ronde wijzigen"
  aria-expanded="false"
  title="Huidige ronde wijzigen"
>
  R<span id="currentRound">1</span>
</button>
        <button id="addMonsterButton" class="add-button" type="button" aria-label="Volgend monster toevoegen" title="Volgend monster toevoegen">+M</button>
        <button id="resetButton" class="secondary-button" type="button">Reset</button>
      </div>
    </header>

    <section class="board" aria-label="Hitpoints van monsters">
      <div id="monsterGroups"></div>
    </section>

    <p class="hint">Klik op een veld om de actuele hitpoints in te voeren of te wijzigen.</p>
  </main>

  <dialog id="hpDialog">
    <form method="dialog" id="hpForm" class="modal">
      <button class="close-button" type="button" id="closeButton" aria-label="Sluiten">×</button>
      <p class="eyebrow" id="dialogMonster">A</p>
      <h2 id="dialogTitle">Veld 1</h2>

      <label for="hpInput">Actuele hitpoints</label>
      <input id="hpInput" name="hp" type="number" inputmode="numeric" min="0" step="1" placeholder="Bijv. 12" autocomplete="off" required>

      <div class="modal-actions">
        <button class="secondary-button" type="button" id="clearButton">Leegmaken</button>
        <button class="primary-button" value="save">Opslaan</button>
      </div>
    </form>
  </dialog>

  <script src="script.js"></script>
  <dialog id="roundDialog">
  <div class="round-modal">
    <button
      class="close-button"
      type="button"
      id="roundCloseButton"
      aria-label="Sluiten"
    >
      ×
    </button>

    <p class="eyebrow">RONDE</p>

    <div class="round-controls">
      <button
        class="round-adjust-button"
        type="button"
        id="roundMinusButton"
        aria-label="Ronde verlagen"
      >
        −
      </button>

      <span id="roundDialogValue">1</span>

      <button
        class="round-adjust-button"
        type="button"
        id="roundPlusButton"
        aria-label="Ronde verhogen"
      >
        +
      </button>
    </div>
  </div>
</dialog>
</body>
</html>
